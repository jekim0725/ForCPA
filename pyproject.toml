[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forcpa"
version = "0.1.0"
description = "Audit workflow automation experiments for CPA work"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
web = ["streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]
